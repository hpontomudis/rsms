; RSMS production overrides. Only settings with a concrete justification are
; here -- everything else uses the php.ini-production defaults this file is
; layered on top of.

; Excel import/export (P2C/P2D) processes small school-scale files (~250
; students, ~47 staff) in memory via PhpSpreadsheet. 256M is generous
; headroom for that scale without being unbounded.
memory_limit = 256M

; Credential-export / bulk-import xlsx files are small administrative
; spreadsheets, not bulk data dumps. 10M/12M caps abuse without blocking
; legitimate use.
upload_max_filesize = 10M
post_max_size = 12M

; Generous enough for a large bulk import to fully validate+write inside one
; request without inviting a runaway script.
max_execution_time = 120
max_input_time = 120

; Never expose stack traces / server details to a public HTTP response.
; APP_DEBUG=false (application-level) is the primary control; this is
; defense in depth at the PHP layer.
expose_php = Off

; Standard production opcache tuning. validate_timestamps stays on so a
; new deploy's files are picked up without an extra step; the alternative
; (off) requires remembering to reset opcache on every deploy.
[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
