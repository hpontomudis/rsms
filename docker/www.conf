[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; Container logs go to stdout/stderr, not files on disk.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
