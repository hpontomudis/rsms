worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    client_max_body_size 12m;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 120;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }

        # Livewire serves its own JS/CSS dynamically at runtime (e.g.
        # livewire-<hash>/livewire.min.js, livewire-<hash>/js/{component}.js
        # -- confirmed via `artisan route:list --path=livewire`), not as
        # real files under public/. Matching by extension alone and
        # returning a bare 404 for anything not physically on disk silently
        # swallowed every one of those routes before PHP-FPM ever saw them
        # -- Livewire had zero working interactivity. try_files falls
        # through to PHP exactly like the main `location /` block already
        # does, so a genuinely static file (public/build/assets/*) is still
        # served directly and cached, and anything else reaches Laravel.
        location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf)$ {
            expires 7d;
            access_log off;
            try_files $uri @php;
        }

        location @php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 120;
        }
    }
}
